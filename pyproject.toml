[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ninelives"
version = "1.0.2"
description = "Lightweight Distributed SCADA & Unbrickable RS-485 Fleet Runtime (MTIP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
]

[project.scripts]
ninelives-flash = "ninelives.cli.ota_flasher:main"
ninelives-rescue = "ninelives.cli.ghost_rescue:main"

[tool.setuptools.packages.find]
where = ["host"]
